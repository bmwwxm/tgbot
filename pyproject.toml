[project]
name = "goodmoney-bot"
version = "1.0.0"
description = "GoodMoney — Telegram Mini App investment bot with TON blockchain"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "aiogram>=3.10,<4",
    "asyncpg>=0.29,<1",
    "aiohttp>=3.9,<4",
    "python-dotenv>=1.0,<2",
    "tonsdk>=1.0.2,<2",
    "apscheduler>=3.10,<4",
    "pydantic>=2.0,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
